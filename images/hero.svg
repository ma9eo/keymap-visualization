    <rect x=".6" y=".6" width="90.8" height="90.8" rx="13.4" fill="none" stroke="url(#rimLo)" stroke-width="1.2"/>
    <rect x="4" y="3.2" width="84" height="83.4" rx="10.5" fill="url(#face)"/>
