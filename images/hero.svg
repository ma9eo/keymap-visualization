<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 315" width="1672" height="941" font-family="'M PLUS Rounded 1c','Zen Maru Gothic','Noto Sans CJK JP',sans-serif" role="img" aria-label="複雑なキーマップを、ひと目で。6キー構成。AのホールドはShift。AとSのComboでEscape、DとFのComboでマウスレイヤー。親指キーは左右クリックを表示。">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ece3"/><stop offset="1" stop-color="#ebe2d7"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6efe6"/><stop offset="1" stop-color="#e2d5c6"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf9f4"/><stop offset=".6" stop-color="#f8f2ea"/><stop offset="1" stop-color="#f0e7dc"/></linearGradient>
  <linearGradient id="rimHi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <linearGradient id="rimLo" x1="0" y1="0" x2="1" y2="1"><stop offset=".55" stop-color="#b9a48d" stop-opacity="0"/><stop offset="1" stop-color="#b9a48d" stop-opacity=".55"/></linearGradient>
  <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="b1"/>
    <feOffset in="b1" dx="0" dy="1.6" result="o1"/>
    <feFlood flood-color="#6e5640" flood-opacity=".22" result="c1"/>
    <feComposite in="c1" in2="o1" operator="in" result="s1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b2"/>
    <feOffset in="b2" dx="0" dy="5" result="o2"/>
    <feFlood flood-color="#6e5640" flood-opacity=".16" result="c2"/>
    <feComposite in="c2" in2="o2" operator="in" result="s2"/>
    <feMerge><feMergeNode in="s2"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="560" height="376" fill="url(#bg)"/>
<text x="280" y="25" font-size="7.5" font-weight="700" letter-spacing="3.2" fill="#63584c" text-anchor="middle">KEYMAP VISUALIZATION</text>
<text x="280" y="59" font-size="22" font-weight="800" fill="#33291f" text-anchor="middle">複雑なキーマップを、ひと目で</text>

