    <rect x="4" y="3.2" width="84" height="83.4" rx="10.5" fill="none" stroke="url(#rimHi)" stroke-width="1.4"/></g>
<rect x="6" y="6" width="38.5" height="17" rx="5" fill="#9dbbe3"/>
<text x="25.25" y="18.82" font-size="12" fill="#14488d" font-weight="800" text-anchor="middle">↑</text>
