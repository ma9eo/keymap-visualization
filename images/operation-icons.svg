<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 216" width="1040" height="216" font-family="'M PLUS Rounded 1c','Zen Maru Gothic','Noto Sans CJK JP',sans-serif" role="img" aria-label="操作記号。記号なしは長押し、丸2つは2回タップ、丸3つは3回タップ、スイッチはトグル、縦棒への矢印は移動、Uターンする矢印はワンショット">
<style>@import url("https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap");</style>
<defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ece3"/><stop offset="1" stop-color="#ebe2d7"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#ground)"/>
<text x="75" y="52" font-size="15" font-weight="700" fill="#776d64" text-anchor="middle">なし</text><text x="110" y="43" font-size="17" font-weight="700" fill="#33291f">長押し（ホールド）</text><text x="110" y="63" font-size="13.5" font-weight="500" fill="#6b5f52">押し続けると働く</text><svg x="560" y="30" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.315" cy="12" r="3.35" fill="#776d64"/><circle cx="15.685" cy="12" r="3.35" fill="#776d64"/></svg><text x="610" y="43" font-size="17" font-weight="700" fill="#33291f">2回タップ</text><text x="610" y="63" font-size="13.5" font-weight="500" fill="#6b5f52">素早く2回押す</text><svg x="60" y="88" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.63" cy="12" r="3.35" fill="#776d64"/><circle cx="12" cy="12" r="3.35" fill="#776d64"/><circle cx="19.37" cy="12" r="3.35" fill="#776d64"/></svg><text x="110" y="101" font-size="17" font-weight="700" fill="#33291f">3回タップ</text><text x="110" y="121" font-size="13.5" font-weight="500" fill="#6b5f52">素早く3回押す</text><svg x="560" y="88" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#776d64" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6.2" width="20" height="11.6" rx="5.8"/><circle cx="8.1" cy="12" r="3.7" fill="#776d64" stroke="none"/></svg><text x="610" y="101" font-size="17" font-weight="700" fill="#33291f">トグル</text><text x="610" y="121" font-size="13.5" font-weight="500" fill="#6b5f52">押すたびにオンとオフが切り替わる</text><svg x="60" y="146" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#776d64" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13.3m-4.1-4.1 4.1 4.1-4.1 4.1M20.3 4v16"/></svg><text x="110" y="159" font-size="17" font-weight="700" fill="#33291f">移動</text><text x="110" y="179" font-size="13.5" font-weight="500" fill="#6b5f52">そのレイヤーへ移って、そこに留まる</text><svg x="560" y="146" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#776d64" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 4) scale(.5)" stroke-width="4.2"><path d="M5 10H29C38 10 38 23 29 23H8"/><path d="M14 17L8 23L14 29"/></g></svg><text x="610" y="159" font-size="17" font-weight="700" fill="#33291f">ワンショット</text><text x="610" y="179" font-size="13.5" font-weight="500" fill="#6b5f52">次の1キーを押すまでだけ有効</text>
</svg>
