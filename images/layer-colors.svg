<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 208" width="1040" height="208" font-family="'M PLUS Rounded 1c','Zen Maru Gothic','Noto Sans CJK JP',sans-serif" role="img" aria-label="色のルール。濃い色はそのレイヤーへ入る、淡い色はそのレイヤーにいる間に押したときの出力、白地に枠線は Base へ戻る">
<style>@import url("https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap");</style>
<defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ece3"/><stop offset="1" stop-color="#ebe2d7"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#ground)"/>
<g font-size="17" font-weight="700" fill="#33291f">
  <!-- 濃い色：入る -->
  <rect x="60" y="30" width="110" height="34" rx="10" fill="#127a55"/><text x="115" y="54" font-size="19" fill="#ffffff" text-anchor="middle">レイヤー</text>
  <text x="200" y="47">濃い色：そのレイヤーへ<tspan font-weight="800">入る</tspan></text>
  <text x="200" y="68" font-size="13.5" font-weight="500" fill="#6b5f52">長押しや切り替えのキーの帯</text>
  <!-- 淡い色：いる間 -->
  <rect x="60" y="88" width="110" height="34" rx="10" fill="#97c0ab"/><text x="115" y="112" font-size="19" fill="#0c4f37" text-anchor="middle">F1</text>
  <text x="200" y="105">淡い色：そのレイヤーに<tspan font-weight="800">いる間</tspan>に押したときの出力</text>
  <text x="200" y="126" font-size="13.5" font-weight="500" fill="#6b5f52">キーの上部のセル、そのレイヤーでの長押しの帯</text>
  <!-- 白地に枠線：Base へ戻る -->
  <rect x="60.75" y="146.75" width="108.5" height="32.5" rx="10" fill="#ffffff" stroke="#45403a" stroke-width="1.5"/><text x="115" y="170" font-size="19" fill="#33291f" text-anchor="middle">Base</text>
  <text x="200" y="163">白地に枠線：<tspan font-weight="800">Base</tspan> へ戻る</text>
  <text x="200" y="184" font-size="13.5" font-weight="500" fill="#6b5f52">追加レイヤーの中で Base へ戻るキーのラベル</text>
</g>
</svg>
